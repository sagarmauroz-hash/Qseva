name: CI/CD

on:
  push:
    branches:
      - main

env:
  IMAGE_NAME: ghcr.io/sagarmauroz-hash/qseva
  OPENSHIFT_NAMESPACE: sagarmauroz-dev

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:

      # -----------------------------------------
      # 1. Checkout source code
      # -----------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v4

      # -----------------------------------------
      # 2. Log in to GitHub Container Registry
      # -----------------------------------------
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # -----------------------------------------
      # 3. Build and push Docker image
      # -----------------------------------------
      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:${{ github.sha }}
            ${{ env.IMAGE_NAME }}:latest

      # -----------------------------------------
      # 4. Install OpenShift CLI
      # -----------------------------------------
      - name: Install OpenShift CLI
        uses: redhat-actions/oc-installer@v1

      # -----------------------------------------
      # 5. Log in to OpenShift
      # -----------------------------------------
      - name: Login to OpenShift
        run: |
          oc login \
            --server="${{ secrets.OPENSHIFT_SERVER }}" \
            --token="${{ secrets.OPENSHIFT_TOKEN }}" \
            --insecure-skip-tls-verify=true

      # -----------------------------------------
      # 6. Select OpenShift project
      # -----------------------------------------
      - name: Select OpenShift project
        run: |
          oc project "${{ env.OPENSHIFT_NAMESPACE }}"

      # -----------------------------------------
      # 7. Apply Kubernetes/OpenShift manifests
      # -----------------------------------------
      - name: Apply OpenShift manifests
        run: |
          oc apply -f k8s/ \
            -n "${{ env.OPENSHIFT_NAMESPACE }}"

      # -----------------------------------------
      # 8. Update QueueLess image
      # -----------------------------------------
      - name: Update QueueLess image
        run: |
          oc set image deployment/queueless \
            queueless=${{ env.IMAGE_NAME }}:${{ github.sha }} \
            -n "${{ env.OPENSHIFT_NAMESPACE }}"

      # -----------------------------------------
      # 9. Show deployment status
      # -----------------------------------------
      # IMPORTANT:
      # We intentionally DO NOT run:
      #
      # oc rollout status deployment/queueless
      #
      # This allows GitHub Actions to continue even
      # if QueueLess Pods are not Ready yet.
      # -----------------------------------------
      - name: Show deployment status
        run: |
          echo "======================================"
          echo "DEPLOYMENT"
          echo "======================================"

          oc get deployment queueless \
            -n "${{ env.OPENSHIFT_NAMESPACE }}"

          echo "======================================"
          echo "PODS"
          echo "======================================"

          oc get pods \
            -n "${{ env.OPENSHIFT_NAMESPACE }}" \
            -l app=queueless \
            -o wide

          echo "======================================"
          echo "POSTGRES PODS"
          echo "======================================"

          oc get pods \
            -n "${{ env.OPENSHIFT_NAMESPACE }}" \
            -l app=postgres \
            -o wide

      # -----------------------------------------
      # 10. Deployment complete
      # -----------------------------------------
      - name: Deployment submitted
        run: |
          echo "OpenShift deployment has been submitted."
          echo "Rollout status check has been intentionally bypassed."