apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: queueless-app
  namespace: sagarmauroz-dev
spec:
  podSelector:
    matchLabels:
      app: queueless

  policyTypes:
    - Ingress
    - Egress

  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: sagarmauroz-dev
      ports:
        - protocol: TCP
          port: 8000

  egress:
    # PostgreSQL access.
    - to:
        - podSelector:
            matchLabels:
              app: postgres
      ports:
        - protocol: TCP
          port: 5432

    # Kubernetes DNS is required to resolve the postgres Service name.
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: openshift-dns
          podSelector:
            matchLabels:
              dns.operator.openshift.io/daemonset-dns: default
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53

---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: postgres
  namespace: sagarmauroz-dev
spec:
  podSelector:
    matchLabels:
      app: postgres

  policyTypes:
    - Ingress

  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: queueless
      ports:
        - protocol: TCP
          port: 5432
