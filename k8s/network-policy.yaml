apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: queueless-app
  namespace: sagarmauroz
spec:
  podSelector:
    matchLabels:
      app: queueless

  policyTypes:
    - Ingress
    - Egress

  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: sagarmauroz
      ports:
        - protocol: TCP
          port: 8000

  egress:
    - to:
        - podSelector:
            matchLabels:
              app: postgres
      ports:
        - protocol: TCP
          port: 5432

---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: postgres
  namespace: sagarmauroz
spec:
  podSelector:
    matchLabels:
      app: postgres

  policyTypes:
    - Ingress

  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: queueless
      ports:
        - protocol: TCP
          port: 5432