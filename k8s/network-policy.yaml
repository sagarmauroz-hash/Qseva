apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: {name: queueless-default-deny, namespace: queueless}
spec:
  podSelector: {}
  policyTypes: [Ingress, Egress]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: {name: queueless-app-allow, namespace: queueless}
spec:
  podSelector: {matchLabels: {app: queueless}}
  policyTypes: [Ingress, Egress]
  ingress:
  - from: [{namespaceSelector: {}}]
  egress:
  - to: [{namespaceSelector: {}}]
