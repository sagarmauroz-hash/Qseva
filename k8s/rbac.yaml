apiVersion: v1
kind: ServiceAccount
metadata:
  name: queueless
  namespace: sagarmauroz-dev

---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: queueless-read-config
  namespace: sagarmauroz-dev
rules:
  - apiGroups:
      - ""
    resources:
      - configmaps
    verbs:
      - get

---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: queueless-read-config
  namespace: sagarmauroz-dev
subjects:
  - kind: ServiceAccount
    name: queueless
    namespace: sagarmauroz-dev
roleRef:
  kind: Role
  name: queueless-read-config
  apiGroup: rbac.authorization.k8s.io