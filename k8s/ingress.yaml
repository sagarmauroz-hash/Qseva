apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: queueless
  namespace: queueless
  annotations:
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
spec:
  tls:
  - hosts: [queueless.example.com]
    secretName: queueless-tls
  rules:
  - host: queueless.example.com
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service: {name: queueless, port: {number: 80}}
