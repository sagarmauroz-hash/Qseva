apiVersion: apps/v1
kind: Deployment
metadata:
  name: queueless
  namespace: sagarmauroz-dev
  labels:
    app: queueless
spec:
  replicas: 3

  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1

  minReadySeconds: 10
  progressDeadlineSeconds: 300

  selector:
    matchLabels:
      app: queueless

  template:
    metadata:
      labels:
        app: queueless
    spec:
      serviceAccountName: queueless

      securityContext:
        seccompProfile:
          type: RuntimeDefault

      terminationGracePeriodSeconds: 30

      containers:
        - name: queueless
          image: ghcr.io/sagarmauroz-hash/qseva:latest
          imagePullPolicy: Always

          ports:
            - name: http
              containerPort: 8000
              protocol: TCP

          envFrom:
            - configMapRef:
                name: queueless-config

          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: queueless-secret
                  key: DATABASE_URL
            - name: DB_STARTUP_ATTEMPTS
              value: "20"
            - name: DB_STARTUP_DELAY_SECONDS
              value: "3"

          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            runAsNonRoot: true

          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"

          startupProbe:
            httpGet:
              path: /api/health
              port: http
            failureThreshold: 36
            periodSeconds: 5
            timeoutSeconds: 3

          readinessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3

          livenessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 30
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 3
